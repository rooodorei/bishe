<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 奇妙绘本之旅</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            color: #333;
        }
        .container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            text-align: center;
            border: 4px solid #ffb6c1;
        }
        h1 { color: #ff69b4; }
        
        /* 表单样式 */
        .input-group { margin: 20px 0; text-align: left; }
        label { font-size: 18px; font-weight: bold; color: #555;}
        input, select {
            width: 100%; padding: 12px; margin-top: 8px;
            border: 2px solid #87ceeb; border-radius: 10px;
            font-size: 16px; box-sizing: border-box;
        }
        
        /* 按钮样式 */
        button {
            background-color: #87ceeb; color: white;
            border: none; border-radius: 15px;
            padding: 15px 30px; font-size: 20px; font-weight: bold;
            cursor: pointer; transition: transform 0.2s;
            margin: 10px 5px; width: 100%;
        }
        button:hover { transform: scale(1.05); background-color: #00bfff; }
        .option-btn { background-color: #ffb6c1; }
        .option-btn:hover { background-color: #ff69b4; }

        /* 故事展示区 */
        #story-image {
            width: 100%; border-radius: 15px; margin-bottom: 20px;
            border: 4px solid #eee; display: none;
        }
        .story-text {
            font-size: 20px; line-height: 1.6; text-align: left;
            background: #fffacd; padding: 20px; border-radius: 15px;
            margin-bottom: 20px;
        }
        .actor-dialogue {
            color: #ff4500; font-weight: bold; margin-top: 10px;
        }

        /* 加载动画 */
        #loading { display: none; margin: 40px 0; }
        .spinner {
            font-size: 50px; animation: spin 2s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        /* 隐藏类 */
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ AI 奇妙绘本之旅 ✨</h1>

    <div id="setup-screen">
        <p style="font-size: 18px; color: #666;">小朋友，快来创造你的绘本主角吧！</p>
        
        <div class="input-group">
            <label>你想探索什么样的主题？</label>
            <select id="theme">
                <option value="魔法森林探险">🌲 魔法森林探险</option>
                <option value="太空宇宙漫游">🚀 太空宇宙漫游</option>
                <option value="深海寻宝奇遇">🌊 深海寻宝奇遇</option>
            </select>
        </div>

        <div class="input-group">
            <label>主角长什么样子呢？(请描述)</label>
            <input type="text" id="features" value="1 girl, 6 years old, blue short hair, wearing a red dress" placeholder="例如：一个穿红裙子的短发小女孩">
        </div>

        <button onclick="startGame()">开始冒险！🚀</button>
    </div>

    <div id="loading" class="hidden">
        <div class="spinner">🪄</div>
        <h3 style="color: #87ceeb;">AI 魔法师正在为你画图，请稍等哦...</h3>
        <p style="color: #999; font-size: 14px;">（大约需要 20-40 秒）</p>
    </div>

    <div id="story-screen" class="hidden">
        <img id="story-image" src="" alt="绘本画面">
        
        <div class="story-text">
            <div id="narrator-text">这里显示旁白...</div>
            <div id="actor-dialogue" class="actor-dialogue">主角说：...</div>
        </div>

        <div id="options-container">
            </div>
    </div>
</div>

<script>
    let currentSessionId = "";

    // 统一切换界面的函数
    function showScreen(screenId) {
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('story-screen').classList.add('hidden');
        document.getElementById(screenId).classList.remove('hidden');
    }

    // 更新故事画面的函数
    function updateStoryUI(data) {
        // 更新图片 (加一个时间戳防止浏览器缓存老图片)
        const img = document.getElementById('story-image');
        img.src = data.image_url + "?t=" + new Date().getTime();
        img.style.display = "block";

        // 更新文本
        document.getElementById('narrator-text').innerText = data.narrator_text;
        document.getElementById('actor-dialogue').innerText = "👦 主角说：\"" + data.actor_dialogue + "\"";

        // 更新选项按钮
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = ""; // 清空旧按钮
        data.options.forEach(optionText => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = "👉 " + optionText;
            btn.onclick = () => makeChoice(optionText);
            optionsContainer.appendChild(btn);
        });

        // 切换到故事界面
        showScreen('story-screen');
    }

    // 1. 初始化游戏
    async function startGame() {
        const theme = document.getElementById('theme').value;
        const features = document.getElementById('features').value;

        showScreen('loading'); // 显示加载动画

        try {
            const response = await fetch('/api/init_story', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ child_features: features, theme: theme })
            });
            const data = await response.json();
            
            if(response.ok) {
                currentSessionId = data.session_id;
                updateStoryUI(data);
            } else {
                alert("糟糕，魔法出错了：" + data.detail);
                showScreen('setup-screen');
            }
        } catch (error) {
            alert("网络连接断开了！");
            showScreen('setup-screen');
        }
    }

    // 2. 玩家做出选择
    async function makeChoice(choiceText) {
        showScreen('loading'); // 再次显示加载动画

        try {
            const response = await fetch('/api/next_turn', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: currentSessionId, user_choice: choiceText })
            });
            const data = await response.json();

            if(response.ok) {
                updateStoryUI(data);
            } else {
                alert("糟糕，魔法出错了：" + data.detail);
                showScreen('story-screen');
            }
        } catch (error) {
            alert("网络连接断开了！");
            showScreen('story-screen');
        }
    }
</script>

</body>
</html>
