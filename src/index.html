<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>底特律：绘本变人</title>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; background-color: #1e1e24; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background-color: #2b2b36; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 800px; padding: 30px; border: 2px solid #5a5a72; }
        h1, h2 { color: #00d2ff; text-align: center; }
        input, select { width: 100%; padding: 12px; margin-top: 8px; border: 2px solid #00d2ff; border-radius: 10px; font-size: 16px; box-sizing: border-box; background: #3c3c4a; color: white; }
        button { background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%); color: white; border: none; border-radius: 15px; padding: 12px 25px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; margin: 10px 5px; }
        button:hover { transform: scale(1.05); filter: brightness(1.2); }
        button:disabled { background: #555 !important; cursor: not-allowed; transform: none; color: #888; }
        
        .story-box { background: #3c3c4a; padding: 20px; border-radius: 15px; margin-bottom: 20px; font-size: 18px; line-height: 1.6; border-left: 5px solid #00d2ff; }
        .image-container { width: 100%; text-align: center; margin-bottom: 20px; border-radius: 15px; overflow: hidden; background: #111; min-height: 200px; }
        #story-image { width: 100%; display: none; }
        .spinner { font-size: 40px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }

        /* ========= 世界线树状 UI (底特律风格) ========= */
        #timeline-container { overflow-x: auto; padding: 40px 20px; background: #1a1a20; border-radius: 15px; border: 1px solid #333; }
        .tree-level { display: flex; flex-direction: column; align-items: center; }
        .tree-children { display: flex; flex-direction: row; gap: 40px; margin-top: 30px; position: relative; }
        /* 连接线 */
        .tree-children::before { content: ''; position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: calc(100% - 240px); height: 2px; background: #00d2ff; z-index: 1; }
        
        .timeline-node { width: 200px; background: #2b2b36; border: 2px solid #00d2ff; border-radius: 12px; padding: 10px; text-align: center; position: relative; z-index: 2; transition: 0.3s; box-shadow: 0 0 15px rgba(0, 210, 255, 0.2); }
        .timeline-node:hover { transform: translateY(-5px); box-shadow: 0 0 20px rgba(0, 210, 255, 0.6); }
        .timeline-node::before { content: ''; position: absolute; top: -30px; left: 50%; transform: translateX(-50%); width: 2px; height: 30px; background: #00d2ff; }
        .timeline-node.root-node::before { display: none; }
        
        .node-img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; background: #111; }
        .node-text { font-size: 12px; color: #ccc; margin-bottom: 10px; height: 35px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .node-choice { color: #00d2ff; font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        .jump-btn { background: transparent; border: 1px solid #00d2ff; color: #00d2ff; padding: 5px 10px; font-size: 12px; width: 100%; margin: 0; }
        .jump-btn:hover { background: #00d2ff; color: #000; }
        .active-node { border-color: #ff0055; box-shadow: 0 0 20px rgba(255, 0, 85, 0.5); }
        .active-node .jump-btn { border-color: #ff0055; color: #ff0055; }
        
        /* 完整阅读样式 */
        .read-page { border-left: 3px solid #ff0055; padding-left: 15px; margin-bottom: 30px; background: #222; padding: 15px; border-radius: 10px;}
        .read-page img { width: 100%; border-radius: 8px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌌 绘本变人</h1>
        
        <div id="setup-screen">
            <label>故事主题</label>
            <select id="theme">
                <option value="赛博朋克探险">🤖 赛博朋克探险</option>
                <option value="魔法森林探险">🌲 魔法森林探险</option>
            </select>
            <label>主角设定</label>
            <input type="text" id="features" value="a cool boy, glowing jacket">
            <button onclick="startGame()" style="width:100%; margin-top:20px;">初始化时间线</button>
        </div>

        <div id="loading-screen" class="hidden" style="text-align: center; padding: 50px;">
            <div class="spinner">⚙️</div>
            <h3 style="color:#00d2ff;">系统运算中，推演未来概率...</h3>
        </div>

        <div id="story-screen" class="hidden">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <button onclick="viewTimeline()" style="background: #333; border: 1px solid #fff; font-size: 14px;">👁️ 查看时间线树</button>
                <button onclick="readFullPath()" style="background: #ff0055; font-size: 14px;">📖 完整阅读当前分支</button>
            </div>
            
            <div class="image-container">
                <img id="story-image" src="">
                <div id="drawing-animation" style="padding: 50px; color:#aaa;">[ 影像合成中... ]</div>
            </div>
            <div class="story-box" id="story-text"></div>
            
            <div id="options-container" style="display:flex; flex-wrap:wrap; gap:10px; margin-top:20px;"></div>
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <input type="text" id="custom-choice" placeholder="输入自定义行为...">
                <button onclick="submitCustomChoice()">执行</button>
            </div>
        </div>

        <div id="timeline-screen" class="hidden">
            <h2>👁️ 命运之树</h2>
            <div id="timeline-container"></div>
            <button onclick="showScreen('story-screen')" style="width:100%; margin-top:20px; background:#444;">返回当前节点</button>
        </div>
        
        <div id="read-screen" class="hidden">
            <h2>📖 当前时间线全记录</h2>
            <div id="read-container"></div>
            <button onclick="showScreen('story-screen')" style="width:100%; margin-top:20px; background:#444;">返回</button>
        </div>
    </div>

    <script>
        let currentSessionId = "";
        let currentPageId = 0; // 核心！现在一切靠节点 ID 驱动

        function showScreen(id) {
            ['setup-screen', 'loading-screen', 'story-screen', 'timeline-screen', 'read-screen'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        async function processTurn(endpoint, payload) {
            showScreen('loading-screen');
            try {
                const res = await fetch(endpoint, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail);

                if (data.session_id) currentSessionId = data.session_id;
                currentPageId = data.page_id;

                document.getElementById('story-text').innerHTML = `${data.narrator_text}<br><br><span style="color:#ff0055">主角："${data.actor_dialogue}"</span>`;
                
                const optsBox = document.getElementById('options-container');
                optsBox.innerHTML = '';
                data.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.innerText = `分岐 > ${opt}`;
                    btn.style.flex = "1";
                    btn.onclick = () => processTurn('/api/next_turn_text', { session_id: currentSessionId, parent_page_id: currentPageId, user_choice: opt });
                    optsBox.appendChild(btn);
                });

                document.getElementById('story-image').classList.add('hidden');
                document.getElementById('drawing-animation').classList.remove('hidden');
                showScreen('story-screen');

                // 触发渲染
                const imgRes = await fetch('/api/render_image', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ page_id: currentPageId }) });
                const imgData = await imgRes.json();
                
                const img = document.getElementById('story-image');
                img.src = imgData.image_url + "?t=" + Date.now();
                img.onload = () => {
                    document.getElementById('drawing-animation').classList.add('hidden');
                    img.classList.remove('hidden');
                    img.style.display = 'block';
                };

            } catch (e) { alert("错误: " + e.message); showScreen('setup-screen'); }
        }

        function startGame() {
            processTurn('/api/init_story_text', { child_features: document.getElementById('features').value, theme: document.getElementById('theme').value });
        }
        function submitCustomChoice() {
            const val = document.getElementById('custom-choice').value;
            if(!val) return;
            processTurn('/api/next_turn_text', { session_id: currentSessionId, parent_page_id: currentPageId, user_choice: val });
        }

        // ================= 核心：绘制底特律世界线树 =================
        async function viewTimeline() {
            showScreen('loading-screen');
            try {
                const res = await fetch(`/api/get_timeline/${currentSessionId}`);
                const data = await res.json();
                
                // 算法：把扁平的节点组装成嵌套对象树
                let treeMap = {};
                let rootNode = null;
                data.nodes.forEach(n => { n.children = []; treeMap[n.id] = n; });
                data.nodes.forEach(n => {
                    if (n.parent_id === 0) rootNode = n;
                    else if (treeMap[n.parent_id]) treeMap[n.parent_id].children.push(n);
                });

                const container = document.getElementById('timeline-container');
                container.innerHTML = '';
                container.appendChild(renderNode(rootNode));
                showScreen('timeline-screen');
            } catch (e) { alert("读取时间线失败"); showScreen('story-screen'); }
        }

        function renderNode(node) {
            const wrap = document.createElement('div');
            wrap.className = 'tree-level';

            // 节点 UI
            const box = document.createElement('div');
            box.className = `timeline-node ${node.parent_id === 0 ? 'root-node' : ''} ${node.id === currentPageId ? 'active-node' : ''}`;
            
            let imgHtml = node.image_url ? `<img src="${node.image_url}" class="node-img">` : `<div class="node-img" style="line-height:100px;">[未加载]</div>`;
            box.innerHTML = `
                ${imgHtml}
                <div class="node-choice">${node.user_choice}</div>
                <div class="node-text">${node.narrator_text}</div>
                <button class="jump-btn" onclick="jumpToNode(${node.id})">
                    ${node.id === currentPageId ? '📍 当前位置' : '↬ 从此分支继续'}
                </button>
            `;
            wrap.appendChild(box);

            // 子节点递归
            if (node.children && node.children.length > 0) {
                const childWrap = document.createElement('div');
                childWrap.className = 'tree-children';
                node.children.forEach(child => childWrap.appendChild(renderNode(child)));
                wrap.appendChild(childWrap);
            }
            return wrap;
        }

        // 跃迁逻辑！非常简单，改变 currentPageId 即可
        function jumpToNode(id) {
            currentPageId = id;
            alert("✨ 跃迁成功！系统环境已重置到该节点。接下来你的决定将产生新的分支。");
            showScreen('story-screen');
            // 由于不想重新调取庞大的图片，这里偷懒让用户通过点击世界线回去后，直接能进行下一步操作。
            // 真实场景你可以重新拉取一下这个节点的数据填充 story-screen。
        }

        // 完整阅读路径
        async function readFullPath() {
            showScreen('loading-screen');
            try {
                const res = await fetch(`/api/get_path/${currentPageId}`);
                const path = await res.json();
                
                let html = '';
                path.forEach((p, i) => {
                    html += `<div class="read-page">
                        <div style="color:#00d2ff;">分支点：${p.user_choice}</div>
                        ${p.image_url ? `<img src="${p.image_url}">` : ''}
                        <div>${p.narrator_text}</div>
                        <div style="color:#ff0055; margin-top:5px;">👦 "${p.actor_dialogue}"</div>
                    </div>`;
                });
                document.getElementById('read-container').innerHTML = html;
                showScreen('read-screen');
            } catch (e) { alert("读取失败"); }
        }
    </script>
</body>
</html>
