<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 奇妙绘本之旅</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            color: #333;
        }

        .container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            text-align: center;
            border: 4px solid #ffb6c1;
        }

        h1 {
            color: #ff69b4;
        }

        .input-group {
            margin: 20px 0;
            text-align: left;
        }

        label {
            font-size: 18px;
            font-weight: bold;
            color: #555;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 2px solid #87ceeb;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            background-color: #87ceeb;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 10px 5px;
            width: 100%;
        }

        button:hover {
            transform: scale(1.05);
            background-color: #00bfff;
        }

        button:disabled {
            background-color: #ccc !important;
            cursor: not-allowed;
            transform: none;
        }

        .option-btn {
            background-color: #ffb6c1;
        }

        /* 故事展示区 */
        .image-container {
            position: relative;
            width: 100%;
            min-height: 300px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 4px solid #eee;
            overflow: hidden;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #story-image {
            width: 100%;
            border-radius: 10px;
        }

        #drawing-animation {
            text-align: center;
            color: #87ceeb;
            font-weight: bold;
        }

        .spinner {
            font-size: 40px;
            animation: spin 2s linear infinite;
            display: inline-block;
            margin-bottom: 10px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .story-text {
            font-size: 20px;
            line-height: 1.6;
            text-align: left;
            background: #fffacd;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .actor-dialogue {
            color: #ff4500;
            font-weight: bold;
            margin-top: 10px;
        }

        #text-loading {
            margin: 40px 0;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>✨ AI 奇妙绘本之旅 ✨</h1>

        <div id="setup-screen">
            <p>小朋友，快来创造你的绘本主角吧！</p>
            <div class="input-group">
                <label>你想探索什么样的主题？</label>
                <select id="theme">
                    <option value="魔法森林探险">🌲 魔法森林探险</option>
                    <option value="太空宇宙漫游">🚀 太空宇宙漫游</option>
                </select>
            </div>
            <div class="input-group">
                <label>主角长什么样子呢？</label>
                <input type="text" id="features" value="1 girl, 6 years old, blue short hair, wearing a red dress">
            </div>
            <button onclick="startGame()">开始冒险！🚀</button>
        </div>

        <div id="text-loading" class="hidden">
            <div class="spinner">🧠</div>
            <h3 style="color: #ff69b4;">大模型正在构思剧情，马上就好...</h3>
        </div>

        <div id="story-screen" class="hidden">
            <div class="image-container">
                <div id="drawing-animation">
                    <div class="spinner">🎨</div>
                    <div>AI 画家正在努力作画中...<br><span style="font-size:14px;color:#999">（你可以先阅读下方的故事）</span></div>
                </div>
                <img id="story-image" src="" alt="绘本画面">
            </div>

            <div class="story-text">
                <div id="narrator-text"></div>
                <div id="actor-dialogue" class="actor-dialogue"></div>
            </div>

            <div id="options-container"></div>

            <div id="custom-input-container" style="margin-top: 20px; display: flex; gap: 10px; align-items: center;">
                <span style="font-size: 20px;">💡</span>
                <input type="text" id="custom-choice" placeholder="或者...自己输入你想做的事情！"
                    style="margin-top: 0; border-color: #ffb6c1;">
                <button id="custom-submit-btn" onclick="submitCustomChoice()"
                    style="width: auto; padding: 12px 20px; margin: 0; background-color: #ff69b4;">发送</button>
            </div>

        </div>
    </div>

    <script>
        let currentSessionId = "";

        function showScreen(screenId) {
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('text-loading').classList.add('hidden');
            document.getElementById('story-screen').classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
        }

        // 核心流程：先请求文字，再请求图片
        async function executeTurn(endpoint, payload) {
            showScreen('text-loading');

            try {
                // 步骤 1：获取文字剧情
                const textRes = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const textData = await textRes.json();

                if (!textRes.ok) throw new Error(textData.detail);
                if (textData.session_id) currentSessionId = textData.session_id;

                // 步骤 2：立马展示文字，隐藏图片，显示“作画中”动画
                document.getElementById('narrator-text').innerText = textData.narrator_text;
                document.getElementById('actor-dialogue').innerText = "👦 主角说：\"" + textData.actor_dialogue + "\"";

                document.getElementById('story-image').classList.add('hidden');
                document.getElementById('drawing-animation').classList.remove('hidden');

                // 👇 锁定自定义输入框和发送按钮
                document.getElementById('custom-choice').disabled = true;
                document.getElementById('custom-submit-btn').disabled = true;

                const optionsContainer = document.getElementById('options-container');
                optionsContainer.innerHTML = "";
                textData.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = "option-btn";
                    btn.innerText = "👉 " + opt;
                    btn.disabled = true; // 图片没画完前不准点，防止逻辑混乱
                    btn.onclick = () => executeTurn('/api/next_turn_text', { session_id: currentSessionId, user_choice: opt });
                    optionsContainer.appendChild(btn);
                });

                showScreen('story-screen');

                // 步骤 3：后台静默请求生成图片
                const imgRes = await fetch('/api/render_image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: currentSessionId })
                });
                const imgData = await imgRes.json();
                if (!imgRes.ok) throw new Error(imgData.detail);

                // 步骤 4：图片画好了，替换画面，激活所有按钮！
                const img = document.getElementById('story-image');
                img.src = imgData.image_url + "?t=" + new Date().getTime();
                img.onload = () => {
                    document.getElementById('drawing-animation').classList.add('hidden');
                    img.classList.remove('hidden');
                    img.style.display = 'block';
                    
                    // 解锁预设选项按钮
                    document.querySelectorAll('.option-btn').forEach(b => b.disabled = false);
                    
                    // 👇 解锁自定义输入框和发送按钮
                    document.getElementById('custom-choice').disabled = false;
                    document.getElementById('custom-submit-btn').disabled = false;
                };

            } catch (error) {
                alert("糟糕，出错了：" + error.message);
                showScreen('setup-screen');
            }
        }

        // 💡 新增：处理小朋友自定义输入的行为
        function submitCustomChoice() {
            const customInput = document.getElementById('custom-choice');
            const customText = customInput.value.trim();
            
            if (!customText) {
                alert("请输入你想做的事情哦！");
                return;
            }
            
            // 调用之前的核心流程，把手写的文本传进去
            executeTurn('/api/next_turn_text', { session_id: currentSessionId, user_choice: customText });
            
            // 清空输入框，准备下一次输入
            customInput.value = '';
        }

        function startGame() {
            const theme = document.getElementById('theme').value;
            const features = document.getElementById('features').value;
            executeTurn('/api/init_story_text', { child_features: features, theme: theme });
        }
    </script>

</body>

</html>
